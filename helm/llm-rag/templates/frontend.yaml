apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: llm-frontend
  template:
    metadata:
      labels:
        app: llm-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"
          ports:
            - containerPort: 8501
---
apiVersion: v1
kind: Service
metadata:
  name: llm-frontend
spec:
  type: LoadBalancer
  selector:
    app: llm-frontend
  ports:
    - port: 8501
      targetPort: 8501
