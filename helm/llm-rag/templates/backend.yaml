apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: llm-backend
  template:
    metadata:
      labels:
        app: llm-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: llm-backend
spec:
  selector:
    app: llm-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
