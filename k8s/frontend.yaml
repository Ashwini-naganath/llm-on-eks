apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-frontend
  template:
    metadata:
      labels:
        app: llm-frontend
    spec:
      containers:
        - name: frontend
          image: 201173334450.dkr.ecr.ap-south-1.amazonaws.com/llm-frontend:v2-rag
          ports:
            - containerPort: 8501

---
apiVersion: v1
kind: Service
metadata:
  name: llm-frontend
spec:
  type: LoadBalancer
  selector:
    app: llm-frontend
  ports:
    - port: 8501
      targetPort: 8501
